[project]
name = "statcard"
version = "0.1.0"
description = "Generate visual, shareable stat cards for Valorant and CS2"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "angelclassasir" },
]

dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "pillow>=10.0",
    "python-dotenv>=1.0",
]

[project.scripts]
statcard = "statcard.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/statcard"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyrefly]
search-path = ["src"]

[dependency-groups]
dev = [
    "pyrefly>=1.3.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]