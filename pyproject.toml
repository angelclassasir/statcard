[project]
name = "statcard"
version = "2.2.1"
description = "Generate visual, shareable stat cards for Valorant and CS2"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "angelclassasir", email = "angelclassasir@gmail.com" },
]
keywords = ["valorant", "statcard", "pillow", "fastapi", "gaming", "fps"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "pillow>=10.1",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.urls]
Homepage = "https://statcard.pages.dev"
Repository = "https://github.com/angelclassasir/statcard"
Issues = "https://github.com/angelclassasir/statcard/issues"
Changelog = "https://github.com/angelclassasir/statcard/blob/master/CHANGELOG.md"

[project.scripts]
statcard = "statcard.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/statcard"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyrefly]
search-path = ["src"]
project-includes = ["src", "tests", "scripts"]

[dependency-groups]
dev = [
    "pyrefly>=1.3.2",
    "pre-commit>=4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
